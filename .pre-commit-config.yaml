# Checks that run on every commit. Same tools as `make check` / CI.
# One-time setup:  make hooks      Run everywhere:  pre-commit run --all-files
exclude: ^(tests/fixtures/|tests/snapshots/|docs/_build/|assets/|project-docs/tasks/|gnost/reporters/vendor/)

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Ruff: linter and formatter (the project's formatter is `ruff format`)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
        files: ^(gnost|tests)/
