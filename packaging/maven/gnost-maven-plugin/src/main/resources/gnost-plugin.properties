version=${project.version}
# Filled in by the release build (-Dgnost.release.version, -Dgnost.sha.KEY); a local
# build leaves the placeholders, and the plugin then refuses to download.
release.version=${gnost.release.version}
sha.darwin-arm64=${gnost.sha.darwin-arm64}
sha.linux-x64=${gnost.sha.linux-x64}
sha.win32-x64=${gnost.sha.win32-x64}
