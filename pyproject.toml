[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnost"
dynamic = ["version"]
description = "GNOST — Codebase Knowledge"
readme = "README-pypi.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name="Mohd Zain", email = "zainmohd1998@gmail.com" }
]

dependencies = [
    "rich",
    "tqdm",
    "termcolor",
    "bandit",
    "radon",
    "mypy",
    "ruff",
    "tomli; python_version < '3.11'",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest", "jsonschema"]

[project.urls]
Documentation = "https://gnost.readthedocs.io"
Source = "https://github.com/mohdzain98/gnost"
Issues = "https://github.com/mohdzain98/gnost/issues"
Changelog = "https://github.com/mohdzain98/gnost/blob/main/CHANGELOG.md"

[project.scripts]
gnost = "gnost.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gnost.__version__" }

[tool.setuptools.packages.find]
include = ["gnost*"]

[tool.setuptools.package-data]
gnost = ["reporters/templates/*", "reporters/vendor/*", "analysis/config/*.ini", "schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# Fixture projects are test data; formatting them would change the snapshots.
extend-exclude = ["tests/fixtures", "tests/snapshots"]
