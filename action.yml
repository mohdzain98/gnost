name: "GNOST Codebase Onboarding and Quality Gate"
description: "Onboarding guide, quality gate and pull request change report for your repo, from the GNOST Docker image."
author: "Mohd Zain"
branding:
  icon: "search"
  color: "blue"

inputs:
  path:
    description: "Folder to analyze, relative to the repository root."
    default: "."
  fail-under:
    description: "Fail the job when the final score (0 to 10) is below this. Empty means no limit."
    default: ""
  baseline:
    description: "Baseline file (see `gnost analyze --write-baseline`). Findings in it are not reported."
    default: ""
  fail-on-new:
    description: "With a baseline, fail the job when there are findings that are not in it."
    default: "false"
  sarif:
    description: "Upload the findings to GitHub code scanning (the job needs `security-events: write`)."
    default: "true"
  onboard:
    description: "Also write the onboarding guide into .gnost/ (and upload it as an artifact)."
    default: "false"
  comment:
    description: "On pull requests, post one comment (updated on each push) with what changed, the blast radius and the risk, and add the same report to the job summary. Needs `fetch-depth: 0` and `pull-requests: write`. Pull requests from forks get only the job summary (their token is read-only), unless `fork-comments` is on."
    default: "false"
  fork-comments:
    description: "On pull requests from forks, hand the report to the comment workflow written by `gnost init --github-action --fork-comments` (as the `gnost-comment` artifact), which posts it."
    default: "false"
  version:
    description: "GNOST version (Docker image tag). Defaults to the version of this action, or latest."
    default: ""

outputs:
  exit-code:
    description: "Exit code of `gnost analyze` (0 passed, 3 quality gate failed)."
    value: ${{ steps.analyze.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    - id: analyze
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_UNDER: ${{ inputs.fail-under }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_FAIL_ON_NEW: ${{ inputs.fail-on-new }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_ONBOARD: ${{ inputs.onboard }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_FORK_COMMENTS: ${{ inputs.fork-comments }}
        BASE_REF: ${{ github.base_ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        THIS_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        TAG="$INPUT_VERSION"
        if [ -z "$TAG" ]; then
          # An action pinned to v0.6.0 uses the 0.6.0 image; a branch uses the latest one.
          if [[ "$ACTION_REF" =~ ^v[0-9] ]]; then TAG="${ACTION_REF#v}"; else TAG="latest"; fi
        fi
        IMAGE="ghcr.io/mohdzain98/gnost:$TAG"
        gnost() { docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE":/repo -w /repo "$IMAGE" "$@"; }

        ARGS=(analyze "/repo/$INPUT_PATH" -o --no-progress)
        [ "$INPUT_SARIF" = "true" ] && ARGS+=(--sarif)
        [ -n "$INPUT_FAIL_UNDER" ] && ARGS+=(--fail-under "$INPUT_FAIL_UNDER")
        if [ -n "$INPUT_BASELINE" ]; then
          ARGS+=(--baseline "/repo/$INPUT_BASELINE")
          [ "$INPUT_FAIL_ON_NEW" = "true" ] && ARGS+=(--fail-on-new)
        fi

        if [ "$INPUT_COMMENT" = "true" ] && [ -n "$BASE_REF" ]; then
          # A failed comment must never fail the job, so every error here is ignored.
          gnost changes "origin/$BASE_REF" "/repo/$INPUT_PATH" --format markdown --no-write \
            > "$RUNNER_TEMP/gnost-changes.md" 2> "$RUNNER_TEMP/gnost-changes.err" \
            && echo "changes-file=$RUNNER_TEMP/gnost-changes.md" >> "$GITHUB_OUTPUT" \
            || cat "$RUNNER_TEMP/gnost-changes.err" || true
        fi

        if [ "$INPUT_ONBOARD" = "true" ]; then gnost onboard "/repo/$INPUT_PATH"; fi
        set +e
        gnost "${ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/gnost-analyze.txt"
        CODE="${PIPESTATUS[0]}"
        set -e
        echo "exit-code=$CODE" >> "$GITHUB_OUTPUT"
        {
          echo "### GNOST"
          grep -E "final score|Quality gate failed|Baseline:" "$RUNNER_TEMP/gnost-analyze.txt" | sed 's/\x1b\[[0-9;]*m//g' | sed 's/^/- /'
        } >> "$GITHUB_STEP_SUMMARY" || true

        CHANGES="$RUNNER_TEMP/gnost-changes.md"
        if [ -s "$CHANGES" ]; then
          { echo; cat "$CHANGES"; } >> "$GITHUB_STEP_SUMMARY" || true
          if [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            # A pull request from a fork gets a read-only token, so this job cannot comment.
            echo "fork=true" >> "$GITHUB_OUTPUT"
            if [ "$INPUT_FORK_COMMENTS" = "true" ]; then
              mkdir -p "$RUNNER_TEMP/gnost-comment"
              cp "$CHANGES" "$RUNNER_TEMP/gnost-comment/comment.md"
              echo "$PR_NUMBER" > "$RUNNER_TEMP/gnost-comment/pr-number"
              echo "$HEAD_SHA" > "$RUNNER_TEMP/gnost-comment/head-sha"
              echo "comment-dir=$RUNNER_TEMP/gnost-comment" >> "$GITHUB_OUTPUT"
              echo "::notice title=GNOST::This pull request comes from a fork, so the GNOST comment workflow posts the comment after this run."
            else
              echo "::notice title=GNOST::Comments are not possible on pull requests from forks (GitHub gives them a read-only token). The change report is in the job summary. To comment anyway: gnost init --github-action --fork-comments (https://gnost.readthedocs.io/en/latest/ci.html#comments-on-pull-requests-from-forks)"
            fi
          fi
        fi

    - name: Comment on the pull request
      if: ${{ always() && inputs.comment == 'true' && steps.analyze.outputs.changes-file != '' && steps.analyze.outputs.fork != 'true' }}
      continue-on-error: true
      uses: actions/github-script@v7
      env:
        CHANGES_FILE: ${{ steps.analyze.outputs.changes-file }}
      with:
        script: |
          const body = require('fs').readFileSync(process.env.CHANGES_FILE, 'utf8');
          const marker = '<!-- gnost-changes -->';
          const {owner, repo} = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number});
          // only GNOST's own comment, never someone else's that happens to contain the marker
          const mine = comments.find(c => c.user && c.user.login === 'github-actions[bot]' && c.body && c.body.includes(marker));
          if (mine) {
            await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body});
          } else {
            await github.rest.issues.createComment({owner, repo, issue_number, body});
          }

    - name: Hand the report to the comment workflow (pull request from a fork)
      if: ${{ always() && inputs.fork-comments == 'true' && steps.analyze.outputs.comment-dir != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: gnost-comment
        path: ${{ steps.analyze.outputs.comment-dir }}
        retention-days: 1

    - name: Upload findings to code scanning
      if: ${{ always() && inputs.sarif == 'true' && hashFiles('.gnost/analysis/analysis.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: .gnost/analysis/analysis.sarif
        category: gnost

    - name: Upload the onboarding guide
      if: ${{ always() && inputs.onboard == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: gnost
        path: .gnost

    - name: Apply the quality gate
      if: ${{ always() && steps.analyze.outputs.exit-code != '0' }}
      shell: bash
      env:
        CODE: ${{ steps.analyze.outputs.exit-code }}
      run: exit "${CODE:-1}"
