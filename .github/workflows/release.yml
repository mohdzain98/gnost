name: Release

# v0.5.0     -> PyPI, GHCR (latest), npm (latest), GitHub Release
# v0.5.0rc1  -> TestPyPI, GHCR (rc tag), npm (next), GitHub pre-release
# Maven Central runs last; the repository variable SKIP_MAVEN=true skips it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      npm: ${{ steps.v.outputs.npm }}
      maven: ${{ steps.v.outputs.maven }}
      is_rc: ${{ steps.v.outputs.is_rc }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION="$(python3 scripts/channel_versions.py pypi)"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match gnost/__init__.py version $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm=$(python3 scripts/channel_versions.py npm)" >> "$GITHUB_OUTPUT"
          echo "maven=$(python3 scripts/channel_versions.py maven)" >> "$GITHUB_OUTPUT"
          if echo "$VERSION" | grep -Eq '(a|b|rc)[0-9]+$'; then echo "is_rc=true" >> "$GITHUB_OUTPUT"; else echo "is_rc=false" >> "$GITHUB_OUTPUT"; fi

  windows-tests:
    # Windows has had real bugs. A release candidate may go out without it passing
    # (the Windows npm package is then left out); a final release may not.
    needs: meta
    runs-on: windows-2022
    outputs:
      passed: ${{ steps.t.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - id: t
        shell: bash
        run: |
          if pytest -q; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi

  gate:
    needs: [meta, windows-tests]
    runs-on: ubuntu-24.04
    steps:
      - env:
          IS_RC: ${{ needs.meta.outputs.is_rc }}
          WINDOWS: ${{ needs.windows-tests.outputs.passed }}
        run: |
          if [ "$IS_RC" = "false" ] && [ "$WINDOWS" != "true" ]; then
            echo "Windows tests must pass before a final release."; exit 1
          fi
          [ "$WINDOWS" = "true" ] || echo "::warning::Windows tests failed; the Windows npm package is skipped for this release candidate."

  dist:
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  binaries:
    needs: meta
    uses: ./.github/workflows/build-binaries.yml

  github-release:
    needs: [meta, gate, dist, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IS_RC: ${{ needs.meta.outputs.is_rc }}
        run: |
          mkdir release && cd release
          find ../artifacts -type f \( -name 'gnost-*.tar.gz' -o -name 'gnost-*.zip' -o -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} . \;
          sha256sum * > SHA256SUMS
          FLAGS=""; [ "$IS_RC" = "true" ] && FLAGS="--prerelease"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" * --title "$TAG" --generate-notes $FLAGS --repo "$GITHUB_REPOSITORY"
          fi

  publish-pypi:
    needs: [meta, gate, dist, binaries]
    runs-on: ubuntu-24.04
    environment: ${{ needs.meta.outputs.is_rc == 'true' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          repository-url: ${{ needs.meta.outputs.is_rc == 'true' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  publish-docker:
    needs: [meta, publish-pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          IS_RC: ${{ needs.meta.outputs.is_rc }}
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gnost"
          if [ "$IS_RC" = "true" ]; then
            echo "list=$IMG:$VERSION,$IMG:rc" >> "$GITHUB_OUTPUT"
            echo "pip_extra=--pre --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/" >> "$GITHUB_OUTPUT"
          else
            MINOR="${VERSION%.*}"
            echo "list=$IMG:$VERSION,$IMG:$MINOR,$IMG:latest" >> "$GITHUB_OUTPUT"
            echo "pip_extra=" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait until pip can install this release
        # The JSON page and the simple index are cached separately; pip reads the index.
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PIP_EXTRA: ${{ steps.tags.outputs.pip_extra }}
        run: |
          for i in $(seq 1 60); do
            python3 -m pip download "gnost==$VERSION" --no-deps -d "$RUNNER_TEMP/wait" $PIP_EXTRA >/dev/null 2>&1 && exit 0
            sleep 15
          done
          echo "pip cannot see gnost $VERSION yet"; exit 1
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            GNOST_VERSION=${{ needs.meta.outputs.version }}
            PIP_EXTRA=${{ steps.tags.outputs.pip_extra }}

  publish-npm:
    needs: [meta, gate, windows-tests, binaries, publish-pypi]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Trusted publishing needs a recent npm
        run: npm install -g npm@latest
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gnost-*
      - name: Assemble packages (skip Windows if its tests failed)
        env:
          WINDOWS: ${{ needs.windows-tests.outputs.passed }}
        run: |
          if [ "$WINDOWS" != "true" ]; then export GNOST_NPM_EXCLUDE=win32-x64; fi
          python scripts/build_npm.py artifacts npm-out
      - name: Publish (platform packages first, then gnost-cli)
        env:
          IS_RC: ${{ needs.meta.outputs.is_rc }}
          NPM_VERSION: ${{ needs.meta.outputs.npm }}
        run: |
          TAG=latest; [ "$IS_RC" = "true" ] && TAG=next
          for d in npm-out/@gnost-cli/* npm-out/gnost-cli; do
            NAME="$(node -p "require('./$d/package.json').name")"
            if npm view "$NAME@$NPM_VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$NPM_VERSION already published, skipping"; continue
            fi
            (cd "$d" && npm publish --provenance --access public --tag "$TAG")
          done

  publish-maven:
    # Goes out last. Uploads to the Central Portal and waits for validation, but
    # never publishes: a person drops a release candidate's upload and presses
    # Publish (or Drop) for a final release in the Portal.
    # Set the repository variable SKIP_MAVEN to "true" (Settings > Secrets and variables
    # > Actions > Variables) to skip this job, e.g. when a release does not touch the
    # plugin. Delete the variable again afterwards.
    if: ${{ vars.SKIP_MAVEN != 'true' }}
    needs: [meta, gate, windows-tests, binaries, publish-npm, publish-docker]
    runs-on: ubuntu-24.04
    environment: maven
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gnost-*
      - name: Package the binaries (skip Windows if its tests failed)
        env:
          WINDOWS: ${{ needs.windows-tests.outputs.passed }}
        run: |
          if [ "$WINDOWS" != "true" ]; then export GNOST_MAVEN_EXCLUDE=windows-x64; fi
          python scripts/build_maven.py artifacts packaging/maven/gnost-binary/binaries
      - name: Set the release version
        working-directory: packaging/maven
        env:
          MAVEN_VERSION: ${{ needs.meta.outputs.maven }}
        run: ./mvnw -B -q org.codehaus.mojo:versions-maven-plugin:2.17.1:set -DnewVersion="$MAVEN_VERSION" -DgenerateBackupPoms=false
      - name: Smoke test the plugin with the Linux binary
        run: scripts/smoke_maven.sh packaging/maven/gnost-binary/binaries
      - name: Sign, upload and wait for Portal validation
        working-directory: packaging/maven
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./mvnw -B -Prelease deploy | tee "$RUNNER_TEMP/deploy.log"
      - name: Release candidate - the upload must be dropped by hand
        if: needs.meta.outputs.is_rc == 'true'
        run: |
          echo "::notice::Validated on the Central Portal but NOT published. Press Drop at https://central.sonatype.com/publishing/deployments (never Publish for a release candidate)."
          echo "### Maven Central: release candidate validated" >> "$GITHUB_STEP_SUMMARY"
          echo "Drop the deployment for ${{ needs.meta.outputs.maven }} at https://central.sonatype.com/publishing/deployments. Do not press Publish." >> "$GITHUB_STEP_SUMMARY"
      - name: Final release - leave it for a person to publish
        if: needs.meta.outputs.is_rc != 'true'
        run: |
          echo "::notice::Validated on the Central Portal. Press Publish at https://central.sonatype.com/publishing/deployments"
          echo "### Maven Central: validated, not published" >> "$GITHUB_STEP_SUMMARY"
          echo "Publish ${{ needs.meta.outputs.maven }} at https://central.sonatype.com/publishing/deployments" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: [meta, publish-pypi, publish-docker, publish-npm]
    uses: ./.github/workflows/verify-install.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      npm_version: ${{ needs.meta.outputs.npm }}
      is_rc: ${{ needs.meta.outputs.is_rc == 'true' }}
