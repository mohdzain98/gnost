name: Feature request
description: Suggest something GNOST should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. For example "I cannot tell which files a pull request affects".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like GNOST to do?
      description: A command, an option or an output, if you have one in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
  - type: dropdown
    id: area
    attributes:
      label: Which part is it about?
      options:
        - onboard (guide, diagrams, explorer)
        - analyze (quality score, findings)
        - changes (what a change touches)
        - CI, GitHub Action, SARIF
        - Maven plugin
        - npm package
        - Languages (a new language or better support)
        - Documentation
        - Something else
